name: Timestamps and commit sha

on:
  push:
#   pull_request:
#     branches:
#       - main

jobs:
  brandon:
    name: Brandon
    runs-on: ubuntu-latest

    steps:
      - name: Set TIMESTAMP and GIT_SHA environment variables
        run: |
          echo "TIMESTAMP=$(TZ=Pacific/Auckland date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "GIT_SHA=sha-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Print specific environment variables
        run: |
          echo "TIMESTAMP=$TIMESTAMP"
          echo "GIT_SHA=$GIT_SHA"